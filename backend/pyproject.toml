[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-based-cctv-video-analytics"
version = "0.1.0"
description = "CCTV video analytics backend for stream processing, camera metadata, and analytics APIs"
requires-python = ">=3.10,<3.13"
dependencies = [
    "alembic>=1.13.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "opencv-python>=4.10.0",
    "numpy>=1.26.0",
    "ultralytics>=8.2.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "requests>=2.31.0",
    "shapely>=2.0.0",
    "lap>=0.5.0",
    "python-multipart>=0.0.9",
    "pyjwt>=2.13.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
]

[tool.setuptools]
packages = []
